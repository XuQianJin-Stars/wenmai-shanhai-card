<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文脉 · 山海卡</title>
<link rel="icon" href="data:,">
<meta name="description" content="文脉·山海卡 — 中国神话 3D 卡牌对战，新中式水墨风，浏览器即玩。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/ui/style.css">
<link rel="stylesheet" href="/src/ui/game.css">
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui"></div>
<div id="load" aria-hidden="true"><div class="wrap">
  <div class="title">文脉</div>
  <div class="sub">山 海 卡</div>
  <svg viewBox="0 0 360 24">
    <defs><filter id="brush" x="-5%" y="-80%" width="110%" height="260%"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></defs>
    <path class="track" d="M6 12 C 90 9, 250 15, 354 11"/>
    <path id="stroke" class="stroke" pathLength="1" d="M6 12 C 90 9, 250 15, 354 11"/>
  </svg>
  <div class="label" id="loadLabel"></div>
  <div class="seal">守</div>
</div></div>
<script>
  window.__load = function (p, label) {
    var e = document.getElementById('stroke'); if (!e) return;
    e.style.strokeDashoffset = String(1 - Math.max(0.015, Math.min(1, p)));
    if (label !== undefined) { var l = document.getElementById('loadLabel'); if (l) l.textContent = label; }
  };
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
